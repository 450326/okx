<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1116" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <title>OKX Trading</title>
    <style>
      body { margin: 0; background: #0f1116; }
      #app-loading {
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
        background: #0f1116; z-index: 9999;
        transition: opacity 0.3s;
      }
      #app-loading.fade-out { opacity: 0; pointer-events: none; }
      .load-spinner {
        width: 36px; height: 36px;
        border: 3px solid rgba(255,255,255,0.08);
        border-top-color: #63ff98;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app-loading"><div class="load-spinner"></div></div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      window.addEventListener('load', () => {
        setTimeout(() => {
          const el = document.getElementById('app-loading');
          if (el) el.classList.add('fade-out');
        }, 400);
        setTimeout(() => {
          const el = document.getElementById('app-loading');
          if (el) el.remove();
        }, 800);
      });
    </script>
  </body>
</html>
